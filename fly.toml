# fly.toml app configuration file generated for mediarent-9naxiq on 2026-10-05T12:36:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mediarent-9naxiq'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  MEDIRENT_DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'medirent_data'
  destination = '/data'
  initial_size = '1gb'
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
